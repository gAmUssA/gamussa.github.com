    url = "/search/"
    weight = 60

[outputs]
  home = ["HTML", "RSS", "JSON"]

[minify]
  disableJSON = true

[security]
  [security.exec]
    allow = ['^(dart-)?sass(-embedded)?$', '^go$', '^git$', '^npx$', '^postcss$', '^tailwindcss$', '^asciidoctor$']

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    style = "github"
    lineNos = false
    noClasses = false
  [markup.asciidocExt]
    backend = "html5"
    safeMode = "unsafe"
    workingFolderCurrent = true
    [markup.asciidocExt.attributes]
      "icons" = "font"
      "sectanchors" = ""
      "idprefix" = ""
      "idseparator" = "-"
      "source-highlighter" = "rouge"
      "rouge-css" = "style"
      "rouge-style" = "github"
      "toc" = ""
      "toclevels" = "2"
      "imagesdir" = "/images"
      "allow-uri-read" = ""
      "figure-caption!" = ""

baseURL = '/'
languageCode = 'en-us'
title = 'gamov.io'
theme = 'PaperMod'
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  description = "Crash Course In Java Brain Surgery — insinuation and speculations"
  author = "Viktor Gamov"
  defaultTheme = "light"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowRssButtonInSectionTermList = true
  ShowShareButtons = false
  ShowToc = true
  TocOpen = false
  comments = false

  [params.profileMode]
    enabled = false

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/gamussa"
  [[params.socialIcons]]
    name = "twitter"
    url = "https://twitter.com/gamussa"
  [[params.socialIcons]]
    name = "bluesky"
    url = "https://bsky.app/profile/gamussa.dev"
  [[params.socialIcons]]
    name = "youtube"
    url = "https://www.youtube.com/@viktorgamov"
  [[params.socialIcons]]
    name = "linkedin"
    url = "https://linkedin.com/in/vikgamov"
  [[params.socialIcons]]
    name = "rss"
    url = "/index.xml"

  [params.assets]
    favicon = "/images/favicon.ico"

  [params.cover]
    hidden = false
    hiddenInList = true


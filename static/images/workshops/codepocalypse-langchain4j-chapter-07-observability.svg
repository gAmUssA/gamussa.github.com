<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="710" viewBox="0 0 1000 710" role="img" aria-labelledby="title description">
<title id="title">Chapter 7: Measure models, native graph and app separately</title>
<desc id="description">Native model listeners capture Jev decisions and Gemini, Claude and OpenAI calls. Native Agentic callbacks capture graph stages and human verdict nodes. Separate Java and MCP events capture tool reads, canonical assembly, approval, receipts and history writes. All feed TraceEvidence, which writes local JSONL and updates the TUI. Separate AgentMonitor listeners on the review-loop and human roots feed HtmlReportGenerator for local topology and execution HTML reports. No hosted exporter is configured.</desc>

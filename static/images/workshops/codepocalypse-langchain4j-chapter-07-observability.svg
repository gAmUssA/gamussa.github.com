<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="585" viewBox="0 0 1000 585" role="img" aria-labelledby="title description">
<title id="title">Chapter 7: Measure models, native graph and app separately</title>
<desc id="description">Native model listeners capture Jev decisions and Gemini, Claude and OpenAI calls. Native Agentic callbacks capture graph stages and human verdict nodes. Separate Java and MCP events capture tool reads, canonical assembly, approval, receipts and history writes. All feed TraceEvidence, which writes local JSONL and updates the TUI. No hosted exporter is configured.</desc>

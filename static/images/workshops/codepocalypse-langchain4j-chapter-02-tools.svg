<g><rect x="705" y="160" width="270" height="116" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/><text x="721" y="195" font-size="22" font-weight="700">Gemini API</text><text x="721" y="229" font-size="20" fill="#475569">Requests named tools</text><text x="721" y="257" font-size="20" fill="#475569">Uses returned facts</text></g>

<g><rect x="365" y="160" width="270" height="116" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/><text x="381" y="195" font-size="22" font-weight="700">Judge agent</text><text x="381" y="229" font-size="20" fill="#475569">OpenAI GPT-6 Astra API</text><text x="381" y="257" font-size="20" fill="#475569">Reviews exact candidate</text></g>
<g><rect x="705" y="160" width="270" height="116" rx="12" fill="#fffbeb" stroke="#a16207" stroke-width="2"/><text x="721" y="195" font-size="22" font-weight="700">Human / native node</text><text x="721" y="229" font-size="20" fill="#475569">Inspect current message</text><text x="721" y="257" font-size="20" fill="#475569">send / hold / feedback</text></g>
<g><rect x="705" y="335" width="270" height="116" rx="12" fill="#ecfdf5" stroke="#0f766e" stroke-width="2"/><text x="721" y="370" font-size="22" font-weight="700">Java approval gate</text><text x="721" y="404" font-size="20" fill="#475569">Binds candidate ID</text><text x="721" y="432" font-size="20" fill="#475569">Delivery envelope</text></g>

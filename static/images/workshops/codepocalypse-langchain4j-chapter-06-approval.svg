<path d="M705 391H645" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="675" y="372" font-size="17" text-anchor="middle" fill="#0f766e" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">MCP</text>
<path d="M365 391H305" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/><text x="335" y="372" font-size="17" text-anchor="middle" fill="#0f766e" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">receipt</text>
<path d="M975 245H990V490H840V505" fill="none" stroke="#64748b" stroke-width="2.5" marker-end="url(#muted)"/><text x="958" y="481" font-size="17" text-anchor="middle" fill="#64748b" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">hold</text>
<text x="25" y="643" font-size="20" fill="#475569">Identify already ran; human feedback keeps the run and target.</text>
<text x="25" y="672" font-size="20" fill="#475569">Judge and Human share six refinements. Revised text needs fresh approval.</text>
<text x="25" y="701" font-size="20" fill="#475569">Refusal or an invalid receipt writes no new history; no automatic resend.</text>

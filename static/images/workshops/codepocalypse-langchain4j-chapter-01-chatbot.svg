<g><rect x="705" y="170" width="270" height="116" rx="12" fill="#faf5ff" stroke="#7e22ce" stroke-width="2"/><text x="721" y="205" font-size="22" font-weight="700">Gemini API</text><text x="721" y="239" font-size="20" fill="#475569">gemini-3.7-flash</text><text x="721" y="267" font-size="20" fill="#475569">Generated text</text></g>

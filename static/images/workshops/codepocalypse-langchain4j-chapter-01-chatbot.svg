<path d="M635 226H695" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="665" y="207" font-size="17" text-anchor="middle" fill="#0f766e" paint-order="stroke" stroke="#f8fafc" stroke-width="5" stroke-linejoin="round">API</text>
<text x="25" y="377" font-size="20" fill="#475569">The app supplies persona context; the model supplies wording.</text>

<text x="25" y="42" font-size="16" font-weight="700" letter-spacing="2" fill="#0f766e">CHAPTER 1 · JAVA 21 · LANGCHAIN4J</text>
<text x="25" y="88" font-size="32" font-weight="700">A prompt becomes a Java call</text>
<text x="25" y="124" font-size="20" fill="#475569">ChatModel and AiServices; no calendar or history retrieval</text>
<g><rect x="25" y="170" width="270" height="116" rx="12" fill="#fffbeb" stroke="#a16207" stroke-width="2"/><text x="41" y="205" font-size="22" font-weight="700">User / TUI</text><text x="41" y="239" font-size="20" fill="#475569">Opening request</text></g>
